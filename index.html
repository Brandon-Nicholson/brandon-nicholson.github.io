<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brandon's Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #neuronCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #0a0a0f;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
        }

        .title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900;
            background: linear-gradient(90deg, #00d4ff, #0099ff, #00d4ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
            margin-bottom: 0.5rem;
            letter-spacing: 0.1em;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .portal-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1rem 2.5rem;
            min-width: 280px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .portal-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .portal-btn:hover::before {
            left: 100%;
        }

        .portal-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.8);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3),
                        inset 0 0 20px rgba(0, 212, 255, 0.1);
            transform: translateY(-2px);
        }

        .portal-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            opacity: 0.8;
        }

        .portal-btn:hover svg {
            opacity: 1;
        }

        /* Glow effect behind buttons */
        .glow-wrapper {
            position: relative;
        }

        .glow-wrapper::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        @media (max-width: 480px) {
            .portal-btn {
                min-width: 240px;
                padding: 0.9rem 2rem;
                font-size: 1rem;
            }

            .subtitle {
                letter-spacing: 0.15em;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="neuronCanvas"></canvas>

    <div class="container">
        <h1 class="title">Brandon's Portal</h1>
        <p class="subtitle">Projects & Links</p>

        <div class="buttons-container glow-wrapper">
            <a href="https://github.com/Brandon-Nicholson" target="_blank" rel="noopener noreferrer" class="portal-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                GitHub
            </a>

            <a href="https://agentvizora.com" target="_blank" rel="noopener noreferrer" class="portal-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                AgentVizora
            </a>

            <a href="https://useclinai.com" target="_blank" rel="noopener noreferrer" class="portal-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm6 11h-3v3h-2v-3H8v-2h3v-3h2v3h3v2z"/>
                </svg>
                ClinAI
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('neuronCanvas');
        const ctx = canvas.getContext('2d');

        let neurons = [];
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initNeurons();
        }

        function initNeurons() {
            neurons = [];
            const numNeurons = Math.floor((canvas.width * canvas.height) / 25000);

            for (let i = 0; i < numNeurons; i++) {
                neurons.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    radius: Math.random() * 2 + 1,
                    pulsePhase: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.02 + Math.random() * 0.02
                });
            }
        }

        function createFiringParticle(startX, startY, endX, endY) {
            particles.push({
                x: startX,
                y: startY,
                targetX: endX,
                targetY: endY,
                progress: 0,
                speed: 0.02 + Math.random() * 0.02,
                alpha: 1
            });
        }

        function updateNeurons() {
            neurons.forEach(neuron => {
                neuron.x += neuron.vx;
                neuron.y += neuron.vy;
                neuron.pulsePhase += neuron.pulseSpeed;

                // Bounce off edges
                if (neuron.x < 0 || neuron.x > canvas.width) neuron.vx *= -1;
                if (neuron.y < 0 || neuron.y > canvas.height) neuron.vy *= -1;

                // Keep in bounds
                neuron.x = Math.max(0, Math.min(canvas.width, neuron.x));
                neuron.y = Math.max(0, Math.min(canvas.height, neuron.y));
            });
        }

        function updateParticles() {
            particles = particles.filter(p => {
                p.progress += p.speed;
                p.alpha = 1 - p.progress;
                return p.progress < 1;
            });

            // Randomly fire neurons
            if (Math.random() < 0.03 && neurons.length > 1) {
                const i = Math.floor(Math.random() * neurons.length);
                const j = Math.floor(Math.random() * neurons.length);
                if (i !== j) {
                    const dx = neurons[j].x - neurons[i].x;
                    const dy = neurons[j].y - neurons[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 200) {
                        createFiringParticle(neurons[i].x, neurons[i].y, neurons[j].x, neurons[j].y);
                    }
                }
            }
        }

        function draw() {
            // Clear canvas completely (no trails)
            ctx.globalAlpha = 1;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw connections
            const connectionDistance = 150;
            for (let i = 0; i < neurons.length; i++) {
                for (let j = i + 1; j < neurons.length; j++) {
                    const dx = neurons[j].x - neurons[i].x;
                    const dy = neurons[j].y - neurons[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < connectionDistance) {
                        const alpha = (1 - dist / connectionDistance) * 0.3;
                        ctx.beginPath();
                        ctx.moveTo(neurons[i].x, neurons[i].y);
                        ctx.lineTo(neurons[j].x, neurons[j].y);
                        ctx.strokeStyle = `rgba(0, 212, 255, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            // Draw firing particles
            particles.forEach(p => {
                const x = p.x + (p.targetX - p.x) * p.progress;
                const y = p.y + (p.targetY - p.y) * p.progress;

                const gradient = ctx.createRadialGradient(x, y, 0, x, y, 8);
                gradient.addColorStop(0, `rgba(0, 212, 255, ${p.alpha})`);
                gradient.addColorStop(0.5, `rgba(0, 150, 255, ${p.alpha * 0.5})`);
                gradient.addColorStop(1, 'rgba(0, 212, 255, 0)');

                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            });

            // Draw neurons
            neurons.forEach(neuron => {
                const pulse = Math.sin(neuron.pulsePhase) * 0.3 + 0.7;
                const radius = neuron.radius * pulse;

                // Outer glow
                const gradient = ctx.createRadialGradient(
                    neuron.x, neuron.y, 0,
                    neuron.x, neuron.y, radius * 4
                );
                gradient.addColorStop(0, `rgba(0, 212, 255, ${0.3 * pulse})`);
                gradient.addColorStop(0.5, `rgba(0, 150, 255, ${0.1 * pulse})`);
                gradient.addColorStop(1, 'rgba(0, 212, 255, 0)');

                ctx.beginPath();
                ctx.arc(neuron.x, neuron.y, radius * 4, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.arc(neuron.x, neuron.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 212, 255, ${0.8 * pulse})`;
                ctx.fill();
            });
        }

        function animate() {
            updateNeurons();
            updateParticles();
            draw();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
